<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Presenter · Case Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#08080c; --ink:#fff; --dim:rgba(255,255,255,.72); --faint:rgba(255,255,255,.38); --line:rgba(255,255,255,.12); --accent:#8b7cff; --serif:"Jost",system-ui,sans-serif; --body:"Open Sans",system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
  .wrap { height: 100%; display: grid; grid-template-rows: 1fr; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--line); font-family: var(--serif); }
  .top .ch { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }
  .top .pg { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }
  .top .pg b { color: var(--ink); font-weight: 500; }
  .top .clock { font-size: 24px; font-weight: 500; letter-spacing: .04em; font-variant-numeric: tabular-nums; color: var(--ink); }
  .top .clock span { font-size: 10px; letter-spacing: .2em; color: var(--faint); margin-left: 10px; text-transform: uppercase; }
  .top .clock.warn { color: #ffb54a; } .top .clock.over { color: #ff5c7a; }
  .main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  .left { display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 14px 24px 8px; gap: 8px; }
  .stagebox { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .pv { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .pv iframe { position: absolute; left: 0; top: 0; width: 1400px; height: 875px; border: 0; transform-origin: 0 0; }
  .lab { position: absolute; left: 14px; top: -20px; font-family: var(--serif); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .bot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bot .status { margin-left: auto; }
  .side { border-top: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); height: var(--script-h, 36vh); min-height: 0; }
  .script { padding: 18px 28px 22px; overflow: auto; min-height: 0; }
  .title { font-family: var(--serif); font-size: 13px; letter-spacing: .06em; color: var(--accent); margin: 0 auto 10px; max-width: 1120px; }
  .text { font-size: clamp(18px, 1.5vw, 24px); line-height: 1.7; color: rgba(255,255,255,.94); max-width: 1120px; margin: 0 auto; }
  .text i { font-style: normal; color: var(--accent); font-family: var(--serif); font-size: .62em; letter-spacing: .08em; padding: 0 4px; vertical-align: middle; }
  .text b { color: #fff; font-weight: 600; }
  .text .script-slot.filled { background: rgba(139,124,255,.22); box-shadow: 0 0 0 4px rgba(139,124,255,.22); border-radius: 6px; color: #fff; }
  .text .script-more { margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--accent); background: rgba(139,124,255,.08); border-radius: 0 10px 10px 0; }
  .meta { display: flex; gap: 28px; align-items: baseline; padding: 10px 28px 0; font-family: var(--serif); }
  .meta h4 { display: inline; margin: 0 8px 0 0; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  .nx { display: inline; font-size: 13px; color: var(--dim); }
  .keys { display: inline-flex; gap: 6px 10px; align-items: center; font-size: 11px; color: var(--dim); margin-left: auto; white-space: nowrap; }
  .keys kbd { font-family: var(--serif); font-size: 10.5px; border: 1px solid rgba(255,255,255,.22); border-radius: 6px; padding: 1px 7px; color: var(--ink); min-width: 40px; text-align: center; display: inline-block; }
  .status { font-size: 11.5px; color: #ff5c7a; letter-spacing: .04em; font-family: var(--serif); }
  .meta .pg { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .meta .pg b { color: var(--ink); font-weight: 500; }
  .meta .clock { font-size: 18px; font-weight: 500; letter-spacing: .04em; font-variant-numeric: tabular-nums; color: var(--ink); margin-left: 18px; }
  .meta .clock.warn { color: #ffb54a; } .meta .clock.over { color: #ff5c7a; }
  .text [data-hov] { border-radius: 6px; padding: 1px 2px; transition: background .2s, color .2s, opacity .2s; }
  .text.haslit [data-hov]:not(.lit) { opacity: .5; }
  .text [data-hov].lit { background: rgba(139,124,255,.22); box-shadow: 0 0 0 4px rgba(139,124,255,.22); color: #fff; }
  .status.on { color: #4bffc9; }
  button { font: inherit; font-family: var(--serif); font-size: 12.5px; letter-spacing: .06em; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
  button.pri { background: var(--accent); border-color: var(--accent); color: #0b0b12; font-weight: 600; }
  button.open { border-color: #4bffc9; color: #4bffc9; }
  /* Q&A panel */
  .qa { position: fixed; inset: 0; z-index: 50; background: rgba(6,6,10,.96); display: none; grid-template-columns: 340px 1fr; }
  .qa.on { display: grid; }
  .qa .list { border-right: 1px solid var(--line); overflow: auto; padding: 18px 14px; }
  .qa .list h3 { margin: 4px 8px 14px; font-family: var(--serif); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  .qa .qi { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 10px 12px; margin-bottom: 4px; color: var(--dim); font-family: var(--body); font-size: 13.5px; line-height: 1.4; cursor: pointer; letter-spacing: 0; }
  .qa .qi i { display: block; font-style: normal; font-family: var(--serif); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .qa .qi:hover { background: rgba(255,255,255,.05); }
  .qa .qi.on { background: rgba(139,124,255,.12); border-color: rgba(139,124,255,.35); color: var(--ink); }
  .qa .ans { overflow: auto; padding: 34px 48px; }
  .qa .ans h2 { margin: 0 0 22px; font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.25; color: var(--ink); max-width: 900px; }
  .qa .ans ul { margin: 0; padding-left: 22px; max-width: 900px; }
  .qa .ans li { font-size: 20px; line-height: 1.65; color: rgba(255,255,255,.92); margin-bottom: 12px; }
  .qa .hint { position: absolute; right: 20px; top: 14px; font-family: var(--serif); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="left">
      <div class="stagebox"><div class="pv" id="pvbox"><span class="lab">You control this · the shared window mirrors it</span><iframe id="pv"></iframe></div></div>
      <div class="bot">
        <button onclick="key('ArrowLeft')">← Prev</button>
        <button class="pri" onclick="key(' ')">Next ␣</button>
        <button onclick="goPage('index.html')">Agenda</button>
        <button onclick="goPage('answer.html')">1 Answer.AI</button>
        <button onclick="goPage('wanaka.html')">2 Wanaka</button>
        <button onclick="goPage('social.html')">3 Side project</button>
        <button class="open" onclick="window.open('index.html?t='+Date.now(),'deck','popup=1,width=1440,height=900')">Open shared window</button>
        <div class="status" id="status">● shared window not open</div>
      </div>
    </div>
    <div class="side">
      <div class="meta">
        <div class="pg" id="pg"></div>
        <div><h4>Next</h4><span class="nx" id="next">—</span></div>
        <div class="keys">
          <kbd>Space</kbd><span>next step</span>
          <kbd>← →</kbd><span>prev / next</span>
          <kbd>1 2 3</kbd><span>chapter</span>
          <kbd>Esc</kbd><span>agenda</span>
          <kbd>E / F</kbd><span>about me / the brief</span>
          <kbd>T</kbd><span>timer</span>
          <kbd>Q</kbd><span>Q&amp;A</span>
        </div>
        <div class="clock" id="clock">00:00</div>
      </div>
      <div class="script"><div class="title" id="title"></div><div class="text" id="text">Loading…</div></div>
    </div>
  </div>
</div>
<div class="qa" id="qa"><div class="list"><h3>Likely questions · Q to close</h3><div id="qlist"></div></div><div class="ans" id="qans"></div><div class="hint">↑ ↓ to move · Q / Esc to close</div></div>
<script>/* Presenter Q&A bank — press Q in presenter.html */
window.QA = [
  { tag: "Hardest part", q: "What was the hardest part of the Answer.AI project?",
    a: ["Saying no. All three directions were real, and two of them had louder internal champions — exam prep looked like fast revenue.",
        "My job was to turn the debate into evidence: the strategic-fit questions plus two-week probes, so the decision wasn't 'Bella's opinion' but 'what 20% of students actually did'.",
        "The second hard part was holding the line on the core. Everyone wanted new features; I kept arguing that if the explanation isn't clearly better, nothing on top of it matters.",
        "Takeaway: the hardest design work was framing the decision, not drawing the screens."] },
  { tag: "Reflection", q: "If you could redo it, what would you do differently?",
    a: ["Run the probes earlier and smaller. We spent weeks debating before we shipped anything — a two-week probe would have ended that argument in week one.",
        "Instrument the core loop before redesigning it. We had good top-line numbers but thin per-step data on where students dropped inside an answer.",
        "Bring the tutors' personalities in earlier. Reach turned out to matter for retention too, and we treated it as a later layer.",
        "And I'd write the goal sentence on day one: 'from solving one question to supporting how students learn every day' — everything got easier once that existed."] },
  { tag: "Influence", q: "How did you get the team to choose daily learning over exam prep?",
    a: ["I didn't argue taste against taste. I laid all three directions against four questions the CEO cared about: growth, existing users, right to win, and keeping college students.",
        "Then I proposed two lightweight probes so the loudest opinions could be checked with real behavior. The AP demo's 4% completion did more than any slide.",
        "I also made the trade-off explicit: exam prep would read as 'not for me' to two million college users. Naming the loss made the choice feel responsible, not conservative.",
        "Result: the decision was owned by the team, and design got a seat from strategy through shipping."] },
  { tag: "Collaboration", q: "Tell me about a disagreement with a PM or engineer and how you handled it.",
    a: ["At Wanaka, engineering wanted to keep all tools visible in the studio — 'power users need them'. I wanted the game scene uncovered and tools sorted by frequency.",
        "Instead of debating, I built the redesign as a working demo with Claude Code and we watched three new creators use both. They found the first game faster in the simpler one, and the power tools were still one click away under Create and Settings.",
        "We agreed on the trade-off in writing: fewer visible controls, faster first game, and a 'click anything to locate it' rule so nothing felt hidden.",
        "What I learned: a demo ends a disagreement faster than a deck."] },
  { tag: "Metrics", q: "How do you know a design decision worked?",
    a: ["I set the metric before the design, tied to the goal sentence. For Answer.AI it was 30-day retention and daily actives, not clicks on the new feature.",
        "Each layer had its own leading signal: follow-up questions for the core, deck creation for flashcards, next-day return for study rooms.",
        "I look at cohorts, not averages — students who built a deck in week one vs. those who didn't — so we know the feature caused it.",
        "And I still go to campus events. The report-card moment is the qualitative check that the numbers mean something."] },
  { tag: "AI workflow", q: "How do you use AI day to day — and where does it fail you?",
    a: ["It's in every step: research agents for direction, Claude Code + Figma on our design system to test feasibility, AI drafts for edge cases, motion and assets, a design-QA skill before review.",
        "Where it fails: taste and consistency. Left alone it drifts — wrong spacing, generic characters, inconsistent tone. That's why I write skills that encode our standards, and why key pages are still designed by hand.",
        "It also fails at judgment: it will happily build the wrong thing beautifully. The 'what' and 'why' stay with me.",
        "Rule of thumb: AI for volume and speed, me for decisions, details and specs."] },
  { tag: "Role", q: "Walk me through how you'd design a new effect from idea to launch.",
    a: ["Start from the formula: an instant hook, a playable loop, a shareable result, a social trigger. If an idea can't fill all four in one sentence, it's not ready.",
        "Prototype the loop first, ugly. With Effect House's visual scripting or a quick Claude Code build, I'd test the first second and the fail state on five people before touching the look.",
        "Then the look: the face, the end card, the caption-worthy frame — because that's what gets screenshotted and posted.",
        "Launch small with a challenge or a duet hook, watch shooting and remix rates for a week, and iterate on the fail moment — failing is content too."] },
  { tag: "JD skill", q: "How do you turn your visual standards and taste into reusable AI skills?",
    a: ["A skill is a written contract: what good looks like, what's forbidden, and examples. For Wanaka's game covers it's composition rules, palette, character framing, and seven reference pairs of good vs. bad.",
        "I write it, run it 20 times, mark the failures, and revise the rules until the failure rate is low enough for the team to use without me.",
        "Three are public: the game cover skill, the agent voice skill, and the design-QA skill engineers run before review.",
        "The mindset: if I'd correct it in a review, it belongs in the skill."] },
  { tag: "Motivation", q: "Why TikTok Effect House, and why now?",
    a: ["Play is where I started — kids' games at ABCmouse — and every product since has been gamified. Effects are the most playful surface on the internet.",
        "The role is exactly where I already work: game loops, AI-assisted creation, turning taste into skills, shipping playable prototypes.",
        "Scale is the draw. At Answer.AI a good decision reached seven million students; an effect can reach hundreds of millions of posts.",
        "And I genuinely enjoy the format — I went through the top creators page and couldn't stop trying them."] },
  { tag: "Cross-timezone", q: "How do you work with a team in China across time zones?",
    a: ["I've done it for two years — Answer.AI's engineers are in China, Wanaka's team is split between the US and China — so it's my normal, not an exception.",
        "The rule is: overlap is for decisions, the rest is async. New York evening is Beijing morning, so I keep one daily window there for reviews and anything that needs a real conversation.",
        "Everything else goes in writing that can be acted on without me: working demos instead of static mocks, a design-QA skill engineers run on their own, specs with the 'why' included so nobody waits eight hours to ask.",
        "And I over-communicate the state of things — a short end-of-day note on what's done, what's blocked, what I need by their morning. It sounds small, but it's what keeps a 12-hour gap from turning into a 24-hour delay.",
        "Being bilingual helps: I can read the room in Chinese and write the doc in English, so nothing gets lost in between."] },
  { tag: "0 → 1", q: "How do you work in a tiny team with a lot of ambiguity?",
    a: ["Write the rule before the roadmap. At Wanaka it was one sentence: people do what they love and are good at, AI does what it does best. Every feature decision checked against it.",
        "Ship working demos instead of documents — with three people, a demo is the spec, the alignment meeting and the user test at once.",
        "Sequence by pain: the three walls — code, art, game design — in the order creators hit them.",
        "And protect the core: I still design the key pages by hand, even when everything else is generated."] }
];
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const pv = $("pv"), box = $("pvbox");
  function fit() {
    const st = box.parentElement.getBoundingClientRect();
    const k = Math.min((st.width - 4) / 1400, (st.height - 26) / 875);
    box.style.width = (1400 * k) + "px"; box.style.height = (875 * k) + "px";
    pv.style.transform = "scale(" + k + ")";
  }
  addEventListener("resize", fit); fit();
  // ---- script + status via the deck-presenter channel
  const bc = new BroadcastChannel("deck-presenter");
  let lastMirror = 0, lastKey = "";
  bc.onmessage = (e) => {
    const m = e.data || {}; if (m.type !== "state") return;
    if (!m.embedded) { lastMirror = Date.now(); return; }
    const html = m.html || "<em>No script for this slide.</em>";
    const keyNow = m.page + "|" + m.index + "|" + html;
    if (keyNow === lastKey) return;
    lastKey = keyNow;
    $("pg").innerHTML = m.page === "index.html" ? "Agenda · <b>" + (m.title || "") + "</b>" : "Slide <b>" + String(m.index + 1).padStart(2, "0") + "</b> / " + String(m.total).padStart(2, "0");
    $("title").textContent = m.page === "index.html" ? "" : (m.title || "");
    $("text").innerHTML = html;
    $("next").textContent = m.next ? m.next : "— end of chapter —";
    $("text").parentElement.scrollTop = 0;
    syncHover();
  };
  function syncHover() {
    let hov = []; try { hov = [...pv.contentWindow.document.querySelectorAll(".hov")]; } catch (e) {}
    const spans = [...$("text").querySelectorAll("[data-hov]")]; let lit = null;
    spans.forEach((sp) => { const ok = hov.some((el) => { try { return el.matches(sp.dataset.hov); } catch (e) { return false; } }); sp.classList.toggle("lit", ok); if (ok) lit = sp; });
    $("text").classList.toggle("haslit", !!lit);
    if (lit) lit.scrollIntoView({ block: "nearest" });
  }
  pv.addEventListener("load", () => { try { const d = pv.contentWindow.document; d.addEventListener("mouseover", () => setTimeout(syncHover, 0)); d.documentElement.addEventListener("mouseleave", () => setTimeout(syncHover, 0)); } catch (e) {} });
  setInterval(() => { bc.postMessage({ type: "hello" }); const ok = Date.now() - lastMirror < 4000; $("status").textContent = ok ? "● shared window connected — share it in Zoom" : "● shared window not open — click “Open shared window”, then share it"; $("status").className = "status" + (ok ? " on" : ""); }, 1500);
  // ---- control the embedded deck
  function key(k) { try { pv.contentWindow.document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true })); } catch (e) {} }
  function goPage(p) { pv.src = p + "?t=" + Date.now(); }
  goPage("index.html");
  const pass = new Set([" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", "e", "f", "E", "F", "1", "2", "3", "[", "]"]);
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { e.preventDefault(); goPage("index.html"); return; }
    if (e.key.toLowerCase() === "t") { e.preventDefault(); toggleTimer(); return; }
    if (e.key === "1" || e.key === "2" || e.key === "3") { e.preventDefault(); goPage(["answer.html", "wanaka.html", "social.html"][+e.key - 1]); return; }
    if (pass.has(e.key)) { e.preventDefault(); key(e.key); }
  });
  // Esc / T inside the iframe too
  pv.addEventListener("load", () => { try { pv.contentWindow.addEventListener("keydown", (e) => { if (e.key === "Escape") goPage("index.html"); if (e.key.toLowerCase() === "t") toggleTimer(); }); } catch (err) {} });

  // ---- Q&A panel
  let qi = 0;
  function renderQA() {
    const list = $("qlist"); list.innerHTML = "";
    QA.forEach((x, i) => { const b = document.createElement("button"); b.className = "qi" + (i === qi ? " on" : ""); b.innerHTML = "<i>" + x.tag + "</i>" + x.q; b.onclick = () => { qi = i; renderQA(); }; list.appendChild(b); });
    const x = QA[qi]; $("qans").innerHTML = "<h2>" + x.q + "</h2><ul>" + x.a.map((l) => "<li>" + l + "</li>").join("") + "</ul>";
  }
  function toggleQA(force) { const on = force === undefined ? !$("qa").classList.contains("on") : force; $("qa").classList.toggle("on", on); if (on) renderQA(); }
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key.toLowerCase() === "q") { e.preventDefault(); toggleQA(); return; }
    if (!$("qa").classList.contains("on")) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); toggleQA(false); }
    if (e.key === "ArrowDown") { e.preventDefault(); e.stopImmediatePropagation(); qi = Math.min(QA.length - 1, qi + 1); renderQA(); }
    if (e.key === "ArrowUp") { e.preventDefault(); e.stopImmediatePropagation(); qi = Math.max(0, qi - 1); renderQA(); }
  }, true);
  pv.addEventListener("load", () => { try { pv.contentWindow.addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "q") toggleQA(); }); } catch (err) {} });
  // ---- timer
  let t0 = null, tick = null;
  function fmt(ms) { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function toggleTimer() { if (t0) { t0 = null; clearInterval(tick); $("clock").firstChild.textContent = "00:00"; $("clock").className = "clock"; return; } t0 = Date.now(); tick = setInterval(() => { const ms = Date.now() - t0; $("clock").firstChild.textContent = fmt(ms); $("clock").className = "clock" + (ms > 40 * 60000 ? " over" : ms > 35 * 60000 ? " warn" : ""); }, 500); }
</script>
</body>
</html>
